[project]
name = "agentic-commerce"
version = "0.1.0"
description = "Voice-Driven Multi-Agent Commerce for Pokemon Trading Cards"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=0.2.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.10.0",
    "diskcache>=5.6.3",
    "sounddevice>=0.5.1",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.3",
    "statsmodels>=0.14.4",
    "chromadb>=0.5.0",
    "google-genai>=0.8.0",
    "groq>=0.11.0",
    "edge-tts>=6.1.12",
    "apify-client>=1.8.0",
    "httpx>=0.27.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
